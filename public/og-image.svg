<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#344ebe" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9fb" />
      <stop offset="100%" stop-color="#e7edf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />

  <!-- Card -->
  <g transform="translate(750, 315)">
    <rect width="350" height="220" rx="20" fill="url(#cardGradient)" />
    <rect x="40" y="50" width="60" height="40" rx="4" fill="#e8e8e8" opacity="0.8" />
    <rect x="40" y="120" width="270" height="5" rx="2" fill="#e8e8e8" opacity="0.6" />
    <rect x="40" y="140" width="220" height="5" rx="2" fill="#e8e8e8" opacity="0.6" />
    <rect x="40" y="160" width="270" height="5" rx="2" fill="#e8e8e8" opacity="0.6" />
  </g>

  <!-- Logo -->
  <g transform="translate(200, 315) scale(2)">
    <rect width="100" height="100" rx="15" fill="url(#cardGradient)" />
    <g fill="white" transform="translate(20, 20) scale(2.5)">
      <path d="M9 10h6v2h-4v3h3v2h-3v5h-2V10z"/>
      <path d="M17 10h6.5l-5 9h5v3h-8l5-9h-3.5v-3z"/>
    </g>
  </g>

  <!-- Text -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#344ebe" text-anchor="middle">
    Site public d'information sur les services
  </text>
</svg>
