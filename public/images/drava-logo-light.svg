<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Définitions des dégradés et effets -->
  <defs>
    <!-- Dégradé holographique dynamique -->
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7; #2ec9f3; #41e97d; #7b2ff7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0cb9ed">
        <animate attributeName="stop-color" values="#0cb9ed; #41e97d; #7b2ff7; #0cb9ed" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#41e97d">
        <animate attributeName="stop-color" values="#41e97d; #7b2ff7; #2ec9f3; #41e97d" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Filtre pour l'effet de flou dynamique -->
    <filter id="glow" x="-30%" y="-30%" width="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fond transparent au lieu de sombre -->
  <rect x="0" y="0" width="500" height="300" fill="white" />
  
  <!-- Logo DRAVA -->
  <g transform="translate(100, 100)">
    <!-- Texte "DRAVA" -->
    <text x="150" y="80" font-family="'Righteous', sans-serif" font-size="80" font-weight="700" text-anchor="middle" fill="#0a1128">DRAVA</text>
    
    <!-- Effet holographique sur le texte -->
    <text x="150" y="80" font-family="'Righteous', sans-serif" font-size="80" font-weight="700" text-anchor="middle" fill="url(#holoGradient)" opacity="0.7" filter="url(#glow)">DRAVA</text>
    
    <!-- Lignes animées en arrière-plan -->
    <g opacity="0.3">
      <line x1="0" y1="0" x2="300" y2="300" stroke="#41e97d" stroke-width="2">
        <animate attributeName="y1" values="-50; 250" dur="3s" repeatCount="indefinite" />
        <animate attributeName="y2" values="0; 300" dur="3s" repeatCount="indefinite" />
      </line>
      <line x1="50" y1="-50" x2="350" y2="250" stroke="#2ec9f3" stroke-width="2">
        <animate attributeName="y1" values="-100; 200" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="y2" values="0; 300" dur="2.5s" repeatCount="indefinite" />
      </line>
      <line x1="100" y1="-100" x2="400" y2="200" stroke="#2ec9f3" stroke-width="2">
        <animate attributeName="y1" values="-150; 150" dur="2.7s" repeatCount="indefinite" />
        <animate attributeName="y2" values="50; 350" dur="2.7s" repeatCount="indefinite" />
      </line>
      <line x1="-50" y1="50" x2="250" y2="350" stroke="#7b2ff7" stroke-width="2">
        <animate attributeName="y1" values="-100; 200" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="y2" values="100; 400" dur="3.2s" repeatCount="indefinite" />
      </line>
    </g>
  </g>
  
  <!-- Élément iconique avec forme abstraite -->
  <path d="M220,220 Q230,200 250,205 T280,220 Q300,235 270,245 T220,220 Z" fill="url(#holoGradient)" opacity="0.8">
    <animate attributeName="d" values="M220,220 Q230,200 250,205 T280,220 Q300,235 270,245 T220,220 Z; M220,220 Q240,210 250,215 T280,230 Q290,245 260,245 T220,220 Z; M220,220 Q230,200 250,205 T280,220 Q300,235 270,245 T220,220 Z" dur="5s" repeatCount="indefinite" />
  </path>
  
  <!-- Tagline -->
  <text x="250" y="210" font-family="'Helvetica', sans-serif" font-size="16" font-weight="300" text-anchor="middle" fill="#0a1128" opacity="0.8">TECHNOLOGIE DE PAIEMENT VIRTUEL</text>
</svg>
