<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <!-- Dégradé holographique dynamique -->
    <linearGradient id="holoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2ff7">
        <animate attributeName="stop-color" values="#7b2ff7; #2ec9f3; #41e97d; #7b2ff7" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" />
      </stop>
      <stop offset="50%" stop-color="#0cb9ed">
        <animate attributeName="stop-color" values="#0cb9ed; #41e97d; #7b2ff7; #0cb9ed" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" />
      </stop>
      <stop offset="100%" stop-color="#41e97d">
        <animate attributeName="stop-color" values="#41e97d; #7b2ff7; #2ec9f3; #41e97d" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1" />
      </stop>
    </linearGradient>
    
    <!-- Filtre pour l'effet de flou dynamique -->
    <filter id="glow" x="-30%" y="-30%" width="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fond avec bordure arrondie -->
  <rect width="16" height="16" rx="3" fill="white" />
  
  <!-- Lettre D stylisée -->
  <g transform="translate(3, 3) scale(0.35)">
    <text x="15" y="20" font-family="'Righteous', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#000000">D</text>
    <text x="15" y="20" font-family="'Righteous', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="url(#holoGradient)" opacity="0.7" filter="url(#glow)">D</text>
  </g>
</svg>
