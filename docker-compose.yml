version: '3.8'

services:
  dravacard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dravacard-app
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - dravacard-network
    environment:
      - NODE_ENV=production
    volumes:
      # Optionnel: pour les logs
      - ./logs/nginx:/var/log/nginx
    labels:
      - "com.dravacard.description=Application DRAVACARD Next.js"

networks:
  dravacard-network:
    driver: bridge

volumes:
  nginx-logs:
