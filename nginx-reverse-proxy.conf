# Configuration Nginx Reverse Proxy pour drava.payool.net
# À placer dans /etc/nginx/sites-available/drava.payool.net

server {
    listen 80;
    listen [::]:80;
    server_name drava.payool.net;

    # Logs
    access_log /var/log/nginx/drava.payool.net.access.log;
    error_log /var/log/nginx/drava.payool.net.error.log;

    # Redirection vers HTTPS (sera activée après l'installation du certificat SSL)
    # return 301 https://$server_name$request_uri;

    # Proxy vers le conteneur Docker sur le port 3000
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # Headers pour le proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (si nécessaire)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gestion des fichiers statiques (optionnel, déjà géré par le conteneur)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# Configuration HTTPS (sera activée après l'installation du certificat SSL)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drava.payool.net;

    # Certificats SSL (Let's Encrypt)
    # Ces lignes seront automatiquement ajoutées par Certbot
    # ssl_certificate /etc/letsencrypt/live/drava.payool.net/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/drava.payool.net/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/drava.payool.net.ssl.access.log;
    error_log /var/log/nginx/drava.payool.net.ssl.error.log;

    # Proxy vers le conteneur Docker
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gestion des fichiers statiques
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité renforcée pour HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
