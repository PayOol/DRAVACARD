name: DNS failover (web only)

on:
  schedule:
    # Offset from the start of the hour. GitHub may delay scheduled runs.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, or allow DNS-only failover after confirmed outage
        type: choice
        required: true
        default: check
        options:
          - check
          - apply
  push:
    branches: [master]
    paths:
      - '.github/workflows/dns-failover.yml'
      - 'scripts/dns-failover.mjs'
      - 'scripts/dns-failover.test.mjs'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/dns-failover.yml'
      - 'scripts/dns-failover.mjs'
      - 'scripts/dns-failover.test.mjs'

permissions:
  contents: read

concurrency:
  group: dns-failover-drava
  cancel-in-progress: false

jobs:
  test:
    name: Test DNS safeguards without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: node --test scripts/dns-failover.test.mjs

  monitor:
    name: Check proxy and allow web DNS failover only
    needs: test
    if: >-
      github.repository == 'PayOol/DRAVACARD' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.DNS_FAILOVER_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Monitor web availability (never calls payment services)
        env:
          CLOUDFLARE_DNS_FAILOVER_TOKEN: ${{ secrets.CLOUDFLARE_DNS_FAILOVER_TOKEN }}
          FAILOVER_MODE: ${{ github.event_name == 'schedule' && '--apply' || (inputs.mode == 'apply' && '--apply' || '--check') }}
        run: node scripts/dns-failover.mjs "$FAILOVER_MODE"
