name: Temporary Worker hotfix deploy

on:
  push:
    branches:
      - fix/tiktok-soleaspay-cancel
    paths:
      - '.github/workflows/worker-hotfix-deploy.yml'

permissions:
  contents: read

jobs:
  deploy-worker:
    name: Validate and deploy DRAVA payment Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_DNS_FAILOVER_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Re-run Worker checks
        run: npm run types && npm run check && npm test && npm run build
      - name: Verify Cloudflare deployment permission
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'No Cloudflare token is configured in GitHub Actions.' >&2; exit 1; }
          npx wrangler deployments list >/dev/null
      - name: Deploy production Worker
        run: npm run deploy
